<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZAZA PANEL (ADMIN ONLY)</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#050816;
color:#00d9ff;
overflow:hidden;
}

/* พื้นหลัง */
body::before{
content:"";
position:fixed;
inset:0;
background:
linear-gradient(#00d9ff11 1px,transparent 1px),
linear-gradient(90deg,#00d9ff11 1px,transparent 1px);
background-size:35px 35px;
animation:bg 8s linear infinite;
pointer-events:none;
}

@keyframes bg{
from{transform:translateY(0);}
to{transform:translateY(35px);}
}

/* หน้าโหลด */
#โหลด{
position:fixed;
inset:0;
background:#050816;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:999;
}

#โหลด h1{
font-size:34px;
text-shadow:0 0 20px #00d9ff;
}

.bar{
width:280px;
height:10px;
border:1px solid #00d9ff;
margin-top:20px;
border-radius:20px;
overflow:hidden;
}

.fill{
height:100%;
width:0%;
background:#00d9ff;
animation:load 3s linear forwards;
}

@keyframes load{
to{width:100%;}
}

/* Panel */
.panel{
display:none;
padding:20px;
width:95%;
max-width:420px;
margin:30px auto;
background6:rgba(255,255,255,.05);
backdrop-filter:blur(12px);
border:1px solid #00d9ff55;
border-radius:20px;
box-shadow:0 0 30px #00d9ff33;
}

.title{
text-align:center;
font-size:28px;
margin-bottom:15px;
text-shadow:0 0 15px #00d9ff;
}

.card{
background:#ffffff10;
padding:12px;
margin:10px 0;
border-radius:14px;
}

label{
display:block;
margin-bottom:8px;
}

select,input[type=range]{
width:100%;
padding:10px;
border:none;
border-radius:10px;
background:#0d1a2d;
color:#00d9ff;
}

.status{
text-align:center;
font-size:18px;
margin-top:15px;
}

button{
width:100%;
padding:14px;
margin-top:15px;
background:#00d9ff;
color:#000;
font-weight:bold;
border:none;
border-radius:12px;
cursor:pointer;
box-shadow:0 0 20px #00d9ff;
}
</style>
</head>

<body>

<div id="โหลด

<div class="panel" id="panel">

<div class="title">
ZAZA PANEL (ADMIN ONLY)
</div>

<div class="card">
<label>เลือกระบบ</label>
<select>
<option>Android</option>
<option>iOS</option>
</select>
</div>

<div class="card">
<label>เลือกเวอร์ชัน</label>
<select>
<option>Free Fire</option>
<option>Free Fire MAX</option>
</select>
</div>

<div class="card">
<label>DPI: <span id="dpi">800</span></label>

<input type="range"
min="200"
max="2000"
value="800"
oninput="dpi.innerText=this.value">
</div>

<div class="status" id="สถานะ">
สถานะ: OFFLINE
</div>

<button onclick="เริ่มระบบ()">
เริ่มระบบ
</button>

</div><script>

/* นาฬิกา */

const clock=document.createElement("div");

clock.style.textAlign="center";
clock.style.color="#00d9ff";
clock.style.marginTop="12px";

document.getElementById("panel")
.appendChild(clock);

setInterval(()=>{

clock.innerHTML=
"🕒 เวลา: "+
new Date().toLocaleTimeString('th-TH');

},1000);


/* Toggle */

const systems=document.createElement("div");

systems.innerHTML=`

<div class="card">
<label>🎯 ล็อคหัว</label>
<button onclick="toggle(this)">OFF</button>
</div>

<div class="card">
<label>🧲 ดูดหัว</label>
<button onclick="toggle(this)">OFF</button>
</div>

`;

document.getElementById("panel")
.appendChild(systems);


function toggle(btn){

if(btn.innerText==="OFF"){

btn.innerText="ON";
btn.style.background="#00ff88";

}else{

btn.innerText="OFF";
btn.style.background="#00d9ff";

}

}


/* เริ่มระบบ */

function เริ่มระบบ(){

document.getElementById("สถานะ")
.innerHTML=
"สถานะ: ONLINE";

}

            <label>SENSITIVITY</label><br>
            <input class="slider" type="range" min="0" max="100"><br><br>

            <label>ADS SENS</label><br>
            <input class="slider" type="range" min="0" max="100">
        </div>

        <div class="card">
            <h2>CROSSHAIR PREVIEW</h2>
            <div class="preview">
                CROSSHAIR PREVIEW BOX
            </div>
        </div>

        <div class="card">
            <h2>CONTROL PANEL</h2>

    </div>

</div>

</body>
</html>

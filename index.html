<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>ZAZA PANEL ADMIN</title>

<style>
body {
    margin: 0;
    height: 100vh;
    background: #000;
    font-family: Arial;
    color: #ffd700;
    overflow: hidden;
}

/* PANEL */
.panel {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.2);
    width: 380px;
    background: rgba(20, 15, 5, 0.95);
    border: 1px solid #ffd700;
    border-radius: 14px;
    padding: 15px;
    opacity: 0;
    animation: open 0.6s ease-out forwards;
    box-shadow: 0 0 25px #ffd70033;
}

@keyframes open {
    0% { transform: translate(-50%, -50%) scale(0.2); opacity: 0; }
    100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
}

.title {
    text-align: center;
    font-size: 18px;
    margin-bottom: 10px;
    text-shadow: 0 0 10px #ffd700;
}

/* ROW */
.row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border: 1px solid #ffd700;
    padding: 10px;
    margin: 8px 0;
    border-radius: 8px;
}

/* SWITCH */
.switch {
    width: 45px;
    height: 22px;
    background: #222;
    border-radius: 20px;
    position: relative;
    cursor: pointer;
    border: 1px solid #ffd700;
    transition: 0.3s;
}

.circle {
    width: 18px;
    height: 18px;
    background: #555;
    border-radius: 50%;
    position: absolute;
    top: 2px;
    left: 2px;
    transition: 0.3s;
}

.switch.active {
    background: #ffd700;
}

.switch.active .circle {
    left: 24px;
    background: #000;
}

/* DROPDOWN */
select {
    background: #111;
    color: #ffd700;
    border: 1px solid #ffd700;
    padding: 5px;
    border-radius: 6px;
}

/* SLIDER */
.slider {
    width: 100%;
    height: 6px;
    background: #222;
    border-radius: 10px;
    margin-top: 10px;
    position: relative;
    border: 1px solid #ffd700;
}

.thumb {
    width: 16px;
    height: 16px;
    background: #ffd700;
    border-radius: 50%;
    position: absolute;
    top: -5px;
    left: 50%;
    transform: translateX(-50%);
    box-shadow: 0 0 10px #ffd700;
    touch-action: none;
}
</style>
</head>

<body>

<div class="panel">

    <div class="title">⚡ ZAZA PANEL ADMIN ⚡</div>

    <!-- TOGGLE -->
    <div class="row">
        🔒 ล็อคหัว
        <div class="switch" onclick="toggle(this)"><div class="circle"></div></div>
    </div>

    <div class="row">
        🎯 ช่วยเล็ง
        <div class="switch" onclick="toggle(this)"><div class="circle"></div></div>
    </div>

    <div class="row">
        🧲 ดูดเป้า
        <div class="switch" onclick="toggle(this)"><div class="circle"></div></div>
    </div>

    <!-- DEVICE SELECT -->
    <div class="row">
        📱 ระบบ
        <select id="device">
            <option>iOS</option>
            <option>Android</option>
        </select>
    </div>

    <!-- GAME SELECT -->
    <div class="row">
        🎮 เกม
        <select id="game">
            <option>Free Fire</option>
            <option>Free Fire MAX</option>
        </select>
    </div>

    <!-- DPI -->
    <div class="row">
        📊 DPI
        <span id="dpiValue">120</span>
    </div>

    <div class="slider" id="slider">
        <div class="thumb" id="thumb"></div>
    </div>

</div>

<script>

/* SWITCH */
function toggle(el) {
    el.classList.toggle("active");
}

/* DPI DRAG FIX (mouse + touch) */
let slider = document.getElementById("slider");
let thumb = document.getElementById("thumb");
let dpiText = document.getElementById("dpiValue");

let dragging = false;

function startDrag() {
    dragging = true;
}

function stopDrag() {
    dragging = false;
}

thumb.addEventListener("mousedown", startDrag);
thumb.addEventListener("touchstart", startDrag);

document.addEventListener("mouseup", stopDrag);
document.addEventListener("touchend", stopDrag);

document.addEventListener("mousemove", move);
document.addEventListener("touchmove", move);

function move(e) {
    if (!dragging) return;

    let rect = slider.getBoundingClientRect();
    let x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;

    let percent = x / rect.width;
    if (percent < 0) percent = 0;
    if (percent > 1) percent = 1;

    let value = Math.floor(percent * 300);
    if (value < 20) value = 20;

    thumb.style.left = (percent * 100) + "%";
    dpiText.innerText = value;
}

</script>

</body>
</html>

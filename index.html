<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZAZA PANEL (ADMIN ONLY)</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#050816;
color:#00d9ff;
overflow:hidden;
}

/* พื้นหลัง */
body::before{
content:"";
position:fixed;
inset:0;
background:
linear-gradient(#00d9ff11 1px,transparent 1px),
linear-gradient(90deg,#00d9ff11 1px,transparent 1px);
background-size:35px 35px;
animation:bg 8s linear infinite;
pointer-events:none;
}

@keyframes bg{
from{transform:translateY(0);}
to{transform:translateY(35px);}
}

/* หน้าโหลด */
#โหลด{
position:fixed;
inset:0;
background:#050816;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:999;
}

#โหลด h1{
font-size:34px;
text-shadow:0 0 20px #00d9ff;
}

.bar{
width:280px;
height:10px;
border:1px solid #00d9ff;
margin-top:20px;
border-radius:20px;
overflow:hidden;
}

.fill{
height:100%;
width:0%;
background:#00d9ff;
animation:load 3s linear forwards;
}

@keyframes load{
to{width:100%;}
}

/* Panel */
.panel{
display:none;
padding:20px;
width:95%;
max-width:420px;
margin:30px auto;
background:rgba(255,255,255,.05);
backdrop-filter:blur(12px);
border:1px solid #00d9ff55;
border-radius:20px;
box-shadow:0 0 30px #00d9ff33;
}

.title{
text-align:center;
font-size:28px;
margin-bottom:15px;
text-shadow:0 0 15px #00d9ff;
}

.card{
background:#ffffff10;
padding:12px;
margin:10px 0;
border-radius:14px;
}

label{
display:block;
margin-bottom:8px;
}

select,input[type=range]{
width:100%;
padding:10px;
border:none;
border-radius:10px;
background:#0d1a2d;
color:#00d9ff;
}

.status{
text-align:center;
font-size:18px;
margin-top:15px;
}

button{
width:100%;
padding:14px;
margin-top:15px;
background:#00d9ff;
color:#000;
font-weight:bold;
border:none;
border-radius:12px;
cursor:pointer;
box-shadow:0 0 20px #00d9ff;
}
</style>
</head>

<body>

<div id="โหลด">

<h1>ZAZA PANEL (ADMIN ONLY)</h1>
<p>กำลังเริ่มต้นระบบ...</p>

<div class="bar">
<div class="fill"></div>
</div>

</div>

<div class="panel" id="panel">

<div class="title">
ZAZA PANEL (ADMIN ONLY)
</div>

<div class="card">
<label>เลือกระบบ</label>
<select>
<option>Android</option>
<option>iOS</option>
</select>
</div>

<div class="card">
<label>เลือกเวอร์ชัน</label>
<select>
<option>Free Fire</option>
<option>Free Fire MAX</option>
</select>
</div>

<div class="card">
<label>DPI: <span id="dpi">800</span></label>

<input type="range"
min="200"
max="2000"
value="800"
oninput="dpi.innerText=this.value">
</div>

<div class="status" id="สถานะ">
สถานะ: OFFLINE
</div>

<button onclick="เริ่มระบบ()">
เริ่มระบบ
</button>

</div>
<script>

/* โหลดเสร็จเข้า Panel */
setTimeout(()=>{

document.getElementById("โหลด").style.display="none";
document.getElementById("panel").style.display="block";

},3000);


/* สร้างเสียงกด */
function เสียง(){

const audio = new Audio(
"data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEA"
);

audio.volume=0.2;

}


/* ปุ่มเริ่มระบบ */

function เริ่มระบบ(){

เสียง();

const status =
document.getElementById("สถานะ");

status.innerHTML=
"สถานะ: ONLINE";

status.style.color="#00ff99";
status.style.textShadow=
"0 0 15px #00ff99";


/* เอฟเฟกต์แสง */

document.body.animate([

{
boxShadow:
"0 0 0px #00d9ff"
},

{
boxShadow:
"0 0 90px #00d9ff"
},

{
boxShadow:
"0 0 0px #00d9ff"
}

],{

duration:800

});

}


/* นาฬิกา */

const clock =
document.createElement("div");

clock.style.position="fixed";
clock.style.top="10px";
clock.style.right="15px";
clock.style.color="#00d9ff";
clock.style.fontSize="14px";

document.body.appendChild(clock);

setInterval(()=>{

const d=new Date();

clock.innerHTML=
"เวลา: "
+d.toLocaleTimeString(
"th-TH"
);

},1000);



/* เอฟเฟกต์เมาส์ */

document.addEventListener(
"mousemove",

e=>{

const dot=
document.createElement("div");

dot.style.position="fixed";
dot.style.left=e.clientX+"px";
dot.style.top=e.clientY+"px";

dot.style.width="5px";
dot.style.height="5px";

dot.style.borderRadius="50%";

dot.style.background=
"#00d9ff";

dot.style.boxShadow=
"0 0 15px #00d9ff";

document.body.appendChild(dot);

setTimeout(
()=>dot.remove(),
300
);

});

</script>

</body>
</html>
<script>

/* โหลดเสร็จเข้าพาเนล */
setTimeout(()=>{

document.getElementById("โหลด").style.display="none";
document.getElementById("panel").style.display="block";

},3000);

/* เสียงกด */
const เสียง=new Audio(
"data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEA"
);

/* เริ่มระบบ */
function เริ่มระบบ(){

try{เสียง.play();}catch(e){}

let สถานะ=document.getElementById("สถานะ");

สถานะ.innerHTML=
"สถานะ: <span style='color:#00ff88'>ONLINE</span>";

/* เอฟเฟกต์แสง */
document.body.animate([

{filter:"brightness(1)"},

{filter:"brightness(2)"},

{filter:"brightness(1)"}

],{

duration:500

});

}

/* นาฬิกา */

let เวลา=document.createElement("div");

เวลา.style.textAlign="center";
เวลา.style.marginTop="12px";
เวลา.style.fontSize="18px";

document.getElementById("panel")
.appendChild(เวลา);

setInterval(()=>{

let t=new Date();

เวลา.innerHTML=
"เวลา: "+
t.toLocaleTimeString('th-TH');

},1000);

</script>

</body>
</html>

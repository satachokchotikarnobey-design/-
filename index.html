<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>ZAZA CYBER PANEL</title>

<style>
body {
    margin: 0;
    height: 100vh;
    background: #000;
    overflow: hidden;
    font-family: Arial;
    color: #00ffcc;
}

/* ===== CYBER BACKGROUND ===== */
.line {
    position: absolute;
    width: 2px;
    height: 200px;
    background: linear-gradient(to bottom, transparent, #00ffcc, transparent);
    animation: move 3s linear infinite;
    opacity: 0.5;
}

@keyframes move {
    0% { transform: translateY(-200px); }
    100% { transform: translateY(100vh); }
}

.orb {
    position: absolute;
    width: 14px;
    height: 14px;
    background: #00ffcc;
    border-radius: 50%;
    box-shadow: 0 0 15px #00ffcc;
    animation: float 4s ease-in-out infinite;
}

@keyframes float {
    0% { transform: translateY(0px); opacity: 0.3; }
    50% { transform: translateY(-80px); opacity: 1; }
    100% { transform: translateY(0px); opacity: 0.3; }
}

/* ===== CENTER GLOW ===== */
.center {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 220px;
    height: 220px;
    transform: translate(-50%, -50%);
    border: 2px solid #00ffcc;
    border-radius: 50%;
    box-shadow: 0 0 40px #00ffcc;
    animation: pulse 2s infinite;
    z-index: 1;
}

@keyframes pulse {
    0% { transform: translate(-50%, -50%) scale(1); }
    50% { transform: translate(-50%, -50%) scale(1.15); }
    100% { transform: translate(-50%, -50%) scale(1); }
}

/* ===== PANEL ===== */
.panel {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 320px;
    background: rgba(17,17,17,0.9);
    border: 1px solid #00ffcc;
    border-radius: 12px;
    padding: 15px;
    z-index: 2;
    backdrop-filter: blur(8px);
}

.title {
    font-size: 18px;
    margin-bottom: 10px;
    text-shadow: 0 0 10px #00ffcc;
}

.row {
    display: flex;
    justify-content: space-between;
    border: 1px solid #00ffcc;
    padding: 8px;
    margin: 8px 0;
    border-radius: 6px;
}

.badge {
    background: #00ffcc;
    color: #000;
    padding: 2px 8px;
    border-radius: 5px;
    font-size: 12px;
}

.slider {
    width: 100%;
}
</style>
</head>

<body>

<div class="center"></div>

<div class="panel">
    <div class="title">ZAZA CONTROL CORE</div>

    <div class="row">
        🧲 ดูดเป้า
        <span class="badge">ACTIVE</span>
    </div>

    <div class="row">
        🎯 ล็อคเป้า
        <span class="badge">ACTIVE</span>
    </div>

    <label>DPI</label>
    <input class="slider" type="range" min="100" max="3200"><br><br>

    <label>SENSITIVITY</label>
    <input class="slider" type="range" min="0" max="100">
</div>

<script>
for (let i = 0; i < 25; i++) {
    let line = document.createElement("div");
    line.className = "line";
    line.style.left = Math.random() * window.innerWidth + "px";
    line.style.animationDuration = (2 + Math.random() * 3) + "s";
    document.body.appendChild(line);
}

for (let i = 0; i < 15; i++) {
    let orb = document.createElement("div");
    orb.className = "orb";
    orb.style.left = Math.random() * window.innerWidth + "px";
    orb.style.top = Math.random() * window.innerHeight + "px";
    orb.style.animationDuration = (2 + Math.random() * 3) + "s";
    document.body.appendChild(orb);
}
</script>

</body>
</html>

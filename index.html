<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CYBER ADMIN PANEL</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial;
  background:#05070a;
  color:#00d9ff;
  overflow:hidden;
}

/* background */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:radial-gradient(circle at top,#00d9ff22,transparent 60%);
  pointer-events:none;
}

/* panel */
.panel{
  width:400px;
  padding:20px;
  border-radius:16px;
  background:rgba(0,0,0,0.85);
  border:1px solid #00d9ff;
  box-shadow:0 0 20px #00d9ff33;
  position:relative;
  z-index:1;
}

.title{
  text-align:center;
  font-size:22px;
  text-shadow:0 0 8px #00d9ff;
  margin-bottom:10px;
}

/* items */
.item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px;
  margin:10px 0;
  background:rgba(0,217,255,0.05);
  border-radius:10px;
}

/* toggle */
.check{
  width:28px;
  height:28px;
  border:2px solid #00d9ff;
  border-radius:6px;
  display:flex;
  justify-content:center;
  align-items:center;
  cursor:pointer;
  user-select:none;
  transition:0.2s;
}

.check.active{
  background:#00d9ff;
  color:#000;
  font-weight:bold;
}

/* slider */
input[type="range"]{
  width:100%;
  accent-color:#00d9ff;
}

.value{
  text-align:center;
  margin-top:6px;
}

/* start button */
.startBtn{
  width:100%;
  padding:10px;
  margin-top:10px;
  background:#00d9ff;
  color:#000;
  border:none;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

.status{
  text-align:center;
  margin-top:8px;
  font-size:13px;
}
</style>
</head>

<body>

<div class="panel">

  <div class="title">CYBER ADMIN PANEL</div>

  <div class="item">
    🎯 ล็อคหัว
    <div class="check" onclick="toggle(this)">✔</div>
  </div>

  <div class="item">
    🧲 ดูดหัว
    <div class="check" onclick="toggle(this)">✔</div>
  </div>

  <div class="item" style="display:block;">
    👆 DPI CONTROL

    <input type="range" min="200" max="2000" value="800"
           oninput="updateDPI(this.value)">

    <div class="value" id="dpiValue">DPI: 800</div>
  </div>

  <button class="startBtn" onclick="startSystem()">START SYSTEM</button>

  <div class="status" id="status">STATUS: OFF</div>

</div>

<script>

function toggle(el){
  el.classList.toggle("active");
}

function updateDPI(val){
  document.getElementById("dpiValue").innerText = "DPI: " + val;
}

function startSystem(){
  document.getElementById("status").innerText = "STATUS: ONLINE 🚀";
}
</script>

</body>
</html>

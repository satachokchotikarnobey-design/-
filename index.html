<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>ZAZA CYBER PANEL</title>

<style>
body {
    margin: 0;
    height: 100vh;
    background: #000;
    overflow: hidden;
    font-family: Arial;
    color: #00ffcc;
}

/* ===== PANEL ===== */
.panel {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.2);
    width: 380px;
    background: rgba(17,17,17,0.92);
    border: 1px solid #00ffcc;
    border-radius: 14px;
    padding: 15px;
    backdrop-filter: blur(10px);
    opacity: 0;
    animation: open 0.6s ease-out forwards;
}

@keyframes open {
    0% { transform: translate(-50%, -50%) scale(0.2); opacity: 0; }
    100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
}

.title {
    text-align: center;
    font-size: 18px;
    margin-bottom: 10px;
    text-shadow: 0 0 10px #00ffcc;
}

/* ===== ROW ===== */
.row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border: 1px solid #00ffcc;
    padding: 10px;
    margin: 8px 0;
    border-radius: 8px;
}

/* ===== TOGGLE SWITCH ===== */
.switch {
    width: 45px;
    height: 22px;
    background: #222;
    border-radius: 20px;
    position: relative;
    cursor: pointer;
    transition: 0.3s;
    border: 1px solid #00ffcc;
}

.circle {
    width: 18px;
    height: 18px;
    background: #555;
    border-radius: 50%;
    position: absolute;
    top: 2px;
    left: 2px;
    transition: 0.3s;
    box-shadow: 0 0 6px #000;
}

.switch.active {
    background: #00ffcc;
}

.switch.active .circle {
    left: 24px;
    background: #000;
}

/* ===== SLIDER ===== */
.slider {
    width: 100%;
    height: 6px;
    background: #222;
    border-radius: 10px;
    margin-top: 10px;
    position: relative;
}

.thumb {
    width: 16px;
    height: 16px;
    background: #00ffcc;
    border-radius: 50%;
    position: absolute;
    top: -5px;
    left: 50%;
    transform: translateX(-50%);
    box-shadow: 0 0 10px #00ffcc;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="panel">
    <div class="title">⚡ ZAZA CYBER PANEL ⚡</div>

    <div class="row">
        🔒 ล็อคหัว
        <div class="switch" onclick="toggle(this)"><div class="circle"></div></div>
    </div>

    <div class="row">
        🎯 ช่วยเล็ง
        <div class="switch" onclick="toggle(this)"><div class="circle"></div></div>
    </div>

    <div class="row">
        🧲 ดูดเป้า
        <div class="switch" onclick="toggle(this)"><div class="circle"></div></div>
    </div>

    <div class="row">
        📱 DPI
        <span id="dpiValue">120</span>
    </div>

    <div class="slider" id="slider">
        <div class="thumb" id="thumb"></div>
    </div>

</div>

<script>

/* ===== TOGGLE SWITCH ===== */
function toggle(el) {
    el.classList.toggle("active");
}

/* ===== DPI SLIDER ===== */
let slider = document.getElementById("slider");
let thumb = document.getElementById("thumb");
let dpiText = document.getElementById("dpiValue");

let dragging = false;

thumb.addEventListener("mousedown", start);
thumb.addEventListener("touchstart", start);

function start() {
    dragging = true;
}

document.addEventListener("mouseup", stop);
document.addEventListener("touchend", stop);

function stop() {
    dragging = false;
}

document.addEventListener("mousemove", move);
document.addEventListener("touchmove", move);

function move(e) {
    if (!dragging) return;

    let rect = slider.getBoundingClientRect();
    let x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;

    let percent = x / rect.width;
    if (percent < 0) percent = 0;
    if (percent > 1) percent = 1;

    let value = Math.floor(percent * 300);
    if (value < 20) value = 20;

    thumb.style.left = (percent * 100) + "%";
    dpiText.innerText = value;
}
</script>

</body>
</html>

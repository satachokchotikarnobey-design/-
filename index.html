<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>ZAZA CYBER PANEL</title>

<style>
body {
    margin: 0;
    height: 100vh;
    background: #000;
    overflow: hidden;
    font-family: Arial;
    color: #00ffcc;
}

/* BACKGROUND */
.center {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 220px;
    height: 220px;
    transform: translate(-50%, -50%);
    border: 2px solid #00ffcc;
    border-radius: 50%;
    box-shadow: 0 0 40px #00ffcc;
    animation: pulse 2s infinite;
}

@keyframes pulse {
    0% { transform: translate(-50%, -50%) scale(1); }
    50% { transform: translate(-50%, -50%) scale(1.15); }
    100% { transform: translate(-50%, -50%) scale(1); }
}

/* PANEL */
.panel {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.2);
    width: 360px;
    background: rgba(17,17,17,0.92);
    border: 1px solid #00ffcc;
    border-radius: 12px;
    padding: 15px;
    backdrop-filter: blur(10px);
    opacity: 0;
    animation: open 0.7s ease-out forwards;
}

@keyframes open {
    0% { transform: translate(-50%, -50%) scale(0.2); opacity: 0; }
    100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
}

/* TITLE */
.title {
    font-size: 18px;
    text-align: center;
    margin-bottom: 10px;
    text-shadow: 0 0 10px #00ffcc;
}

/* BUTTON */
.btn {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border: 1px solid #00ffcc;
    padding: 10px;
    margin: 8px 0;
    border-radius: 6px;
    cursor: pointer;
    transition: 0.25s;
}

.btn:hover {
    background: #00ffcc;
    color: #000;
    transform: scale(1.05);
}

.badge {
    background: #00ffcc;
    color: #000;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="center"></div>

<div class="panel">
    <div class="title">⚡ ZAZA CYBER PANEL ⚡</div>

    <div class="btn" onclick="toggle(this)">🔒 ล็อคหัว <span class="badge">OFF</span></div>
    <div class="btn" onclick="toggle(this)">🎯 ช่วยเล็ง <span class="badge">OFF</span></div>
    <div class="btn" onclick="toggle(this)">🧲 ดูดเป้า <span class="badge">OFF</span></div>
    <div class="btn" onclick="toggle(this)">📱 DPI Control <span class="badge">120</span></div>
    <div class="btn" onclick="toggle(this)">⚙ ตั้งค่า <span class="badge">OFF</span></div>

</div>

<script>
function toggle(btn) {
    let badge = btn.querySelector(".badge");

    if (badge.innerText === "OFF") {
        badge.innerText = "ON";
        btn.style.borderColor = "#00ffcc";
        btn.style.boxShadow = "0 0 10px #00ffcc";
    } 
    else if (badge.innerText === "ON") {
        badge.innerText = "OFF";
        btn.style.boxShadow = "none";
    }
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CYBER ADMIN PANEL</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial;
  background:#05070a;
  color:#00d9ff;
}

/* panel */
.panel{
  width:380px;
  padding:20px;
  border-radius:16px;
  background:rgba(0,0,0,0.85);
  border:1px solid #00d9ff;
}

.title{
  text-align:center;
  font-size:22px;
  margin-bottom:10px;
}

/* item */
.item{
  padding:12px;
  margin:10px 0;
  background:rgba(0,217,255,0.05);
  border-radius:10px;
}

/* slider */
input[type="range"]{
  width:100%;
  accent-color:#00d9ff;
}

.value{
  text-align:center;
  margin-top:8px;
  font-size:14px;
  text-shadow:0 0 6px #00d9ff;
}

/* toggle */
.check{
  width:28px;
  height:28px;
  border:2px solid #00d9ff;
  border-radius:6px;
  display:inline-flex;
  justify-content:center;
  align-items:center;
  cursor:pointer;
  user-select:none;
}

.check.active{
  background:#00d9ff;
  color:#000;
}
</style>
</head>

<body>

<div class="panel">

  <div class="title">CYBER ADMIN PANEL</div>

  <div class="item">
    🎯 ล็อคหัว 100%
    <div class="check" onclick="toggle(this)">✔</div>
  </div>

  <div class="item">
    🧲 ดูดหัว 100%
    <div class="check" onclick="toggle(this)">✔</div>
  </div>

  <div class="item">
    👆 DPI ปรับเลื่อน
    <input type="range" min="200" max="2000" value="800" oninput="updateDPI(this.value)">
    <div class="value" id="dpiValue">DPI: 800</div>
  </div>

</div>

<script>
function toggle(el){
  el.classList.toggle("active");
}

function updateDPI(val){
  document.getElementById("dpiValue").innerText = "DPI: " + val;
}
</script>

</body>
</html>

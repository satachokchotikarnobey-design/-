<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>ZAZA CYBER PANEL</title>

<style>
body {
    margin: 0;
    height: 100vh;
    background: #000;
    overflow: hidden;
    font-family: Arial;
    color: #00ffcc;
}

/* ===== BACKGROUND EFFECT ===== */
.line {
    position: absolute;
    width: 2px;
    height: 200px;
    background: linear-gradient(to bottom, transparent, #00ffcc, transparent);
    animation: move 3s linear infinite;
    opacity: 0.5;
}

@keyframes move {
    0% { transform: translateY(-200px); }
    100% { transform: translateY(100vh); }
}

.orb {
    position: absolute;
    width: 12px;
    height: 12px;
    background: #00ffcc;
    border-radius: 50%;
    box-shadow: 0 0 15px #00ffcc;
    animation: float 4s ease-in-out infinite;
}

@keyframes float {
    0% { transform: translateY(0px); opacity: 0.3; }
    50% { transform: translateY(-60px); opacity: 1; }
    100% { transform: translateY(0px); opacity: 0.3; }
}

/* ===== CENTER GLOW ===== */
.center {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 220px;
    height: 220px;
    transform: translate(-50%, -50%);
    border: 2px solid #00ffcc;
    border-radius: 50%;
    box-shadow: 0 0 40px #00ffcc;
    animation: pulse 2s infinite;
    z-index: 1;
}

@keyframes pulse {
    0% { transform: translate(-50%, -50%) scale(1); }
    50% { transform: translate(-50%, -50%) scale(1.15); }
    100% { transform: translate(-50%, -50%) scale(1); }
}

/* ===== PANEL ===== */
.panel {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.2);
    width: 340px;
    background: rgba(17,17,17,0.92);
    border: 1px solid #00ffcc;
    border-radius: 12px;
    padding: 15px;
    z-index: 2;
    backdrop-filter: blur(8px);
    opacity: 0;
    animation: open 0.6s ease-out forwards;
}

@keyframes open {
    0% { transform: translate(-50%, -50%) scale(0.2); opacity: 0; }
    100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
}

.title {
    font-size: 18px;
    margin-bottom: 10px;
    text-shadow: 0 0 10px #00ffcc;
    text-align: center;
}

/* ===== BUTTON ===== */
.btn {
    display: flex;
    justify-content: space-between;
    border: 1px solid #00ffcc;
    padding: 10px;
    margin: 8px 0;
    border-radius: 6px;
    cursor: pointer;
    transition: 0.3s;
}

.btn:hover {
    background: #00ffcc;
    color: #000;
    transform: scale(1.05);
}

.badge {
    background: #00ffcc;
    color: #000;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="center"></div>

<div class="panel">
    <div class="title">⚡ ZAZA CYBER PANEL ⚡</div>

    <div class="btn">
        🔒 ล็อคหัว (UI)
        <span class="badge">OFF</span>
    </div>

    <div class="btn">
        🎯 ช่วยเล็ง (UI)
        <span class="badge">OFF</span>
    </div>

    <div class="btn">
        🧲 ดูดเป้า (UI)
        <span class="badge">OFF</span>
    </div>

    <div class="btn">
        📱 DPI Control
        <span class="badge">120</span>
    </div>

    <div class="btn">
        ⚙ ตั้งค่า
        <span class="badge">PRO</span>
    </div>

</div>

</body>
</html>
